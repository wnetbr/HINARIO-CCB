<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Hinário Cifrado</title>
    <style>
        :root {
            --bg: #f4f4f9;
            --accent: #007aff;
            --card: rgba(255, 255, 255, 0.75);
            --text: #1c1c1e;
            --secondary: #8e8e93;
            --btn-gray: rgba(229, 229, 234, 0.6);
            --danger: #ff3b30;
            --glass: rgba(255, 255, 255, 0.8);
            --border-glass: 1px solid rgba(255, 255, 255, 0.4);
        }
        
        body { 
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: var(--text); 
            margin: 0; padding: 0; overflow-x: hidden;
            user-select: none; -webkit-tap-highlight-color: transparent;
        }

        .bg-animated {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -1; background: linear-gradient(160deg, #f4f4f9 0%, #e0e0e7 100%);
        }

        .titulo-animado {
            margin: 0 0 15px 0;
            font-size: 58px;
            font-weight: 950;
            letter-spacing: -4px;
            text-transform: uppercase;
            display: inline-block;
            background: linear-gradient(135deg, #27ae60 0%, #007aff 50%, #48484a 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 4px 2px rgba(0, 0, 0, 0.1)) drop-shadow(0 15px 25px rgba(0, 122, 255, 0.15));
            background-size: 200% auto;
            animation: metalShine 8s ease infinite;
        }

        @keyframes metalShine {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* --- MENU TRÊS BARRINHAS --- */
        .menu-icon {
            position: fixed; top: 25px; right: 20px; z-index: 1100;
            width: 30px; height: 22px;
            display: flex; flex-direction: column; justify-content: space-between;
            cursor: pointer; padding: 10px;
        }
        .menu-icon span {
            display: block; width: 100%; height: 3px;
            background: var(--text); border-radius: 10px;
            transition: 0.3s;
        }

        #sideMenu {
            position: fixed; top: 0; right: -100%; width: 100%; height: 100%;
            background: rgba(242, 242, 247, 0.98); backdrop-filter: blur(20px);
            z-index: 1200; transition: right 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; padding: 60px 20px 20px; box-sizing: border-box;
        }
        #sideMenu.active { right: 0; }

        .menu-close { position: absolute; top: 25px; right: 20px; font-weight: 800; color: var(--accent); border: none; background: none; font-size: 16px; }

        .menu-tab {
            background: white; padding: 18px; border-radius: 15px; margin-bottom: 12px;
            display: flex; align-items: center; gap: 12px; font-weight: 700;
            box-shadow: 0 4px 10px rgba(0,0,0,0.03); border: 1px solid rgba(0,0,0,0.05);
        }

        #devCard {
            display: none; width: 100%; flex-grow: 1; border-radius: 20px;
            overflow: hidden; border: 1px solid #ddd; margin-top: 10px;
            background: white; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        #devFrame { width: 100%; height: 100%; border: none; }

        #setupScreen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(242, 242, 247, 0.95); z-index: 1500; display: none;
            flex-direction: column; align-items: center; justify-content: center; padding: 25px;
            box-sizing: border-box; text-align: center; backdrop-filter: blur(15px);
        }

        .setup-card {
            background: #ffffff; padding: 45px 30px; border-radius: 35px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.12); width: 100%; max-width: 380px; box-sizing: border-box;
        }
        
        .btn-setup {
            width: 100%; padding: 20px; border-radius: 18px; border: none;
            font-size: 16px; font-weight: 700; margin-top: 15px; cursor: pointer;
        }
        .btn-offline { background: var(--accent); color: white; }
        .btn-online { background: var(--btn-gray); color: var(--text); }

        .app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; position: relative; }
        
        .card { 
            background: var(--card); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px);
            border-radius: 26px; padding: 25px; margin: 15px; border: var(--border-glass);
            box-shadow: 0 10px 30px rgba(0,0,0,0.03); box-sizing: border-box;
        }

        #homeScreen { text-align: center; padding-top: 6vh; width: 100%; box-sizing: border-box; }

        .number-display { display: flex; justify-content: center; gap: 18px; margin: 40px 0; min-height: 80px; }
        .digit-circle {
            width: 70px; height: 70px; border-radius: 22px;
            background: #ffffff; border: 1.5px solid #d1d1d6;
            display: flex; align-items: center; justify-content: center;
            font-size: 38px; font-weight: 800; color: var(--text);
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .digit-circle.active { border-color: var(--accent); transform: scale(1.1); color: var(--accent); }

        .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; max-width: 340px; margin: 0 auto; padding: 10px; box-sizing: border-box; }
        .key {
            background: rgba(255, 255, 255, 0.9); border: none; height: 70px; border-radius: 20px;
            font-size: 24px; font-weight: 600; color: var(--text); border-bottom: 3px solid #d1d1d6;
        }
        .key:active { transform: translateY(2px); border-bottom-width: 1px; }
        .key.action { font-size: 13px; font-weight: 800; text-transform: uppercase; }

        #hinoScreen { display: none; padding-bottom: 160px; }
        .header-hino { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .btn-back { background: var(--btn-gray); border: none; color: var(--text); padding: 10px 18px; border-radius: 12px; font-weight: 700; font-size: 14px; }
        
        .current-tone-btn {
            background: var(--accent); color: white; border: none;
            padding: 10px 20px; border-radius: 12px; font-weight: 700; font-size: 14px;
        }

        .tone-card {
            display: none; position: absolute; top: 48px; right: 0;
            background: var(--glass); backdrop-filter: blur(30px);
            width: 220px; padding: 15px; border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12); border: var(--border-glass);
            z-index: 100; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .tone-card.show { display: grid; }
        
        .tone-mini-btn { background: var(--btn-gray); border: none; padding: 12px 0; border-radius: 10px; font-weight: 700; font-size: 12px; }
        .tone-mini-btn.active { background: var(--accent) !important; color: white !important; }

        /* AJUSTE PARA CIFRA IDENTICA */
        .cifra-container { 
            overflow-x: auto; 
            background: rgba(255, 255, 255, 0.5); 
            border-radius: 18px; 
            padding: 20px; 
            border: 1px solid rgba(255,255,255,0.3); 
            box-sizing: border-box; 
        }
        .cifra-content { 
            white-space: pre; /* MANTÉM ESPAÇOS E QUEBRAS EXATOS */
            font-family: "SF Mono", "Menlo", "Courier New", monospace; 
            font-size: 15px; 
            line-height: 1.5; 
            color: #2c2c2e; 
            margin: 0;
        }
        .chord { color: var(--accent); font-weight: 800; }

        .scroll-controls {
            position: fixed; bottom: 30px; left: 20px; right: 20px;
            background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(30px);
            border-radius: 30px; padding: 20px; border: var(--border-glass);
            display: flex; align-items: center; gap: 20px; box-shadow: 0 20px 50px rgba(0,0,0,0.12);
            box-sizing: border-box; z-index: 90;
        }
        .scroll-btn { background: var(--accent); color: white; border: none; width: 55px; height: 55px; border-radius: 50%; font-weight: 900; }
        
        input[type=range] { flex-grow: 1; accent-color: var(--accent); }

        .progress-bar { width: 100%; height: 8px; background: #e5e5ea; border-radius: 10px; margin-top: 20px; display: none; overflow: hidden; }
        .progress-fill { width: 0%; height: 100%; background: var(--accent); border-radius: 10px; }
    </style>
</head>
<body>

<div id="mainMenuBtn" class="menu-icon" onclick="toggleMenu()">
    <span></span>
    <span></span>
    <span></span>
</div>

<div id="sideMenu">
    <button class="menu-close" onclick="toggleMenu()">FECHAR ✕</button>
    <h2 style="margin: 0 0 25px 0; letter-spacing: -1px; font-weight: 800;">MENU</h2>
    
    <div id="menuOptions">
        <div class="menu-tab" onclick="configurarOffline()">
            <span>📥</span> SICRONIZAR HINOS OFFLINE
        </div>

        <div class="menu-tab" onclick="abrirDev()">
            <span>👨‍💻</span> DESENVOLVEDOR
        </div>
    </div>

    <div id="devCard">
        <iframe id="devFrame" src=""></iframe>
    </div>
</div>

<div id="setupScreen">
    <div class="setup-card">
        <div style="font-size: 60px; margin-bottom: 20px;">🎶</div>
        <h2 style="margin:0; font-weight: 800; letter-spacing: -1px;">HINÁRIO CIFRADO</h2>
        <p id="setupMsg" style="color:var(--secondary); font-size: 15px; margin-bottom: 30px; line-height: 1.5;">Prepare sua biblioteca para tocar offline.</p>
        <div id="setupButtons">
            <button class="btn-setup btn-offline" onclick="configurarOffline()">SICRONIZAR HINOS OFFLINE</button>
            <button class="btn-setup btn-online" onclick="configurarOnline()">USAR ONLINE</button>
        </div>
        <div class="progress-bar" id="pBarSetup"><div class="progress-fill" id="pFillSetup"></div></div>
        <p id="statusTxtSetup" style="margin-top: 15px; font-size: 12px; color: var(--accent); font-weight: 800; min-height: 15px;"></p>
    </div>
</div>

<div class="bg-animated"></div>

<div class="app">
    <div id="homeScreen">
        <h1 class="titulo-animado">HINÁRIO</h1>
        <div class="number-display" id="dotsContainer">
            <div class="digit-circle" id="dot0"></div>
            <div class="digit-circle" id="dot1"></div>
            <div class="digit-circle" id="dot2"></div>
        </div>
        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key action" style="color: var(--danger)" onclick="deleteLastKey()">APAGAR</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key action" style="color: var(--accent)" onclick="abrirHinoManual()">ABRIR</button>
        </div>
    </div>

    <div id="hinoScreen">
        <div class="card">
            <div class="header-hino">
                <button class="btn-back" onclick="voltar()">‹ FECHAR</button>
                <div style="position: relative;">
                    <button class="current-tone-btn" onclick="toggleToneCard()">TOM: <span id="currentToneLabel">-</span> ▾</button>
                    <div id="toneCard" class="tone-card"></div>
                </div>
            </div>
            <div id="hinoNumero" style="font-weight: 700; font-size: 13px; color: var(--accent); margin-bottom: 5px; opacity: 0.8;"></div>
            <h2 id="hinoTitulo" style="margin: 0 0 18px 0; font-size: 28px; font-weight: 900; letter-spacing: -1px;"></h2>
            <div class="cifra-container"><pre class="cifra-content" id="cifraRender"></pre></div>
        </div>
        <div class="scroll-controls">
            <button id="scrollToggle" class="scroll-btn" onclick="toggleScroll()">INICIAR</button>
            <input type="range" id="scrollSpeed" min="0" max="3" step="0.001" value="0.2">
        </div>
    </div>
</div>

<script>
    const BANCO_DE_DADOS = {
        "1": { 
            titulo: "CRISTO MEU MESTRE", 
            tomOriginal: "G", 
            letra: `G          D     C        G
Cristo, meu mestre e meu Senhor
 C       G     A7          D
Eu Te adoro, por fé, com fervor
G        D      C      D
Rogo que guardes meu coração
 G    C G        D    G
Vem protegê-lo com Tua unção
C   G   Em        D     G
E defendê-lo, ó meu guardião

G        D     C       G
Mestre divino, sempre senti
 C      G       A7      D
Meu coração dependente de Ti
G       D    C          D
Bom fundamento dá-lhe, Senhor
G C      G       D      G
Dá-lhe firmeza, virtude, valor
C    G  Em        D   G
E fortaleza, ó meu protetor

G       D     C       G
Vale profundo, cheio de mal
C      G      A7       D
É este mundo, ó rei divinal
 G     D   C       D
Só Tua força pode manter
G  C   G         D       G
Santo e puro, na graça, meu ser
 C       G Em        D  G
Sempre seguro, com fé e poder

G         D    C      G
Mestre piedoso, com Tua mão
 C     G       A7      D
Faze perfeito o meu coração
G          D  C        D
Santo, ardoroso em Te servir
G  C     G        D        G
Sempre voltado aos bens do porvir
C     G Em      D       G
Mestre amado, desejo Te ouvir` 
        }
        // ... adicione os outros aqui seguindo o mesmo padrão de espaços
    };

    const notasDisplay = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B", "Cm", "C#m", "Dm", "D#m", "Em", "Fm", "F#m", "Gm", "G#m", "Am", "A#m", "Bm"];
    const notasEscala = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    
    let hinoAtual = null, offsetAtual = 0, isScrolling = false, currentInput = "", scrollPos = 0;

    function toggleMenu() { 
        document.getElementById('sideMenu').classList.toggle('active'); 
        document.getElementById('devCard').style.display = 'none';
        document.getElementById('menuOptions').style.display = 'block';
    }

    function abrirDev() {
        document.getElementById('menuOptions').style.display = 'none';
        const card = document.getElementById('devCard');
        const frame = document.getElementById('devFrame');
        card.style.display = 'block';
        frame.src = "https://wnetbr.github.io/-";
    }

    window.onload = () => { if (!localStorage.getItem('h_setup_v3')) document.getElementById('setupScreen').style.display = 'flex'; };
    
    function configurarOnline() { localStorage.setItem('h_setup_v3', 'on'); document.getElementById('setupScreen').style.display = 'none'; }
    
    function configurarOffline() {
        const setupScreen = document.getElementById('setupScreen');
        const pBar = document.getElementById('pBarSetup');
        const pFill = document.getElementById('pFillSetup');
        const status = document.getElementById('statusTxtSetup');
        const buttons = document.getElementById('setupButtons');
        const msg = document.getElementById('setupMsg');
        
        setupScreen.style.display = 'flex';
        buttons.style.display = 'none';
        msg.innerText = "Sincronizando hinos...";
        pBar.style.display = 'block';
        
        let p = 0;
        let i = setInterval(() => { 
            p+=4; pFill.style.width = p+"%"; 
            if(p>=100){ 
                clearInterval(i); 
                status.innerText = "✓ PRONTO PARA USO OFFLINE!"; 
                localStorage.setItem('h_setup_v3','off'); 
                setTimeout(() => {
                    setupScreen.style.display='none';
                    buttons.style.display = 'block';
                    pBar.style.display = 'none';
                    pFill.style.width = "0%";
                    status.innerText = "";
                    if(document.getElementById('sideMenu').classList.contains('active')) toggleMenu();
                }, 1500);
            }
        }, 40);
    }

    const toneCard = document.getElementById('toneCard');
    notasDisplay.forEach(n => {
        let b = document.createElement('button'); 
        b.className = 'tone-mini-btn'; b.innerText = n;
        b.id = 'btn-tom-' + n.replace('#', 'sharp'); 
        b.onclick = (e) => { e.stopPropagation(); mudarTom(n); toggleToneCard(); };
        toneCard.appendChild(b);
    });

    function toggleToneCard() { toneCard.classList.toggle('show'); }

    function updateDots() {
        for(let i=0; i<3; i++) {
            const d = document.getElementById(`dot${i}`);
            if (currentInput[i]) { d.innerText = currentInput[i]; d.classList.add('active'); }
            else { d.innerText = ""; d.classList.remove('active'); }
        }
    }
    function pressKey(k) { if (currentInput.length < 3) { currentInput += k; updateDots(); } }
    function deleteLastKey() { currentInput = currentInput.slice(0, -1); updateDots(); }

    function abrirHinoManual() {
        const n = parseInt(currentInput).toString();
        if (BANCO_DE_DADOS[n]) abrirHino(n); else { alert("Não encontrado"); currentInput=""; updateDots(); }
    }

    function abrirHino(n) {
        hinoAtual = BANCO_DE_DADOS[n];
        document.getElementById('homeScreen').style.display='none';
        document.getElementById('mainMenuBtn').style.display='none';
        document.getElementById('hinoScreen').style.display='block';
        document.getElementById('hinoNumero').innerText = `HINO ${n}`;
        document.getElementById('hinoTitulo').innerText = hinoAtual.titulo;
        mudarTom(hinoAtual.tomOriginal); window.scrollTo(0,0);
    }

    function voltar() { 
        stopScroll(); 
        document.getElementById('homeScreen').style.display='block'; 
        document.getElementById('mainMenuBtn').style.display='flex';
        document.getElementById('hinoScreen').style.display='none'; 
        currentInput=""; updateDots(); 
    }

    function mudarTom(n) {
        let bO = hinoAtual.tomOriginal.replace(/m|dim|sus/g, ''), bE = n.replace(/m|dim|sus/g, '');
        offsetAtual = (notasEscala.indexOf(bE) - notasEscala.indexOf(bO) + 12) % 12;
        document.getElementById('currentToneLabel').innerText = n;
        document.querySelectorAll('.tone-mini-btn').forEach(btn => btn.classList.remove('active'));
        let activeBtn = document.getElementById('btn-tom-' + n.replace('#', 'sharp'));
        if(activeBtn) activeBtn.classList.add('active');
        renderizarCifra();
    }

    function renderizarCifra() {
        const lines = hinoAtual.letra.split('\n');
        const res = lines.map(l => {
            // Regex melhorado para identificar acordes e manter o espaçamento
            if (/^(\s*[CDEFGAB][#b]?[a-zA-Z0-9/+#]*\s*)+$/.test(l)) {
                return l.replace(/[CDEFGAB][#b]?[a-zA-Z0-9/+#]*/g, m => {
                    const transposto = m.replace(/[CDEFGAB][#b]?/g, x => {
                        const index = notasEscala.indexOf(x.replace('b',''));
                        return notasEscala[(index + offsetAtual + 12) % 12];
                    });
                    return `<span class="chord">${transposto}</span>`;
                });
            }
            return l;
        }).join('\n');
        document.getElementById('cifraRender').innerHTML = res;
    }

    function stepScroll() {
        if (!isScrolling) return;
        const speed = parseFloat(document.getElementById('scrollSpeed').value);
        if (speed > 0) {
            scrollPos += speed; if (scrollPos >= 1) { window.scrollBy(0, Math.floor(scrollPos)); scrollPos -= Math.floor(scrollPos); }
        }
        requestAnimationFrame(stepScroll);
    }

    function toggleScroll() {
        if (isScrolling) { stopScroll(); } 
        else { isScrolling = true; document.getElementById('scrollToggle').innerText="PAUSAR"; document.getElementById('scrollToggle').style.background="var(--danger)"; stepScroll(); }
    }
    function stopScroll() { isScrolling = false; document.getElementById('scrollToggle').innerText="INICIAR"; document.getElementById('scrollToggle').style.background="var(--accent)"; }
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hinário Cifrado Pro</title>
    <style>
        :root {
            --bg: #f2f2f7;
            --accent: #007aff;
            --card: #ffffff;
            --text: #1c1c1e;
            --secondary: #8e8e93;
            --btn-gray: #e5e5ea;
            --danger: #ff3b30;
            --glass: rgba(255, 255, 255, 0.9);
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            background: var(--bg); color: var(--text); 
            margin: 0; padding: 0; overflow-x: hidden;
            user-select: none;
        }
        .app { width: 100%; min-height: 100vh; display: flex; flex-direction: column; }
        
        .card { background: var(--card); border-radius: 20px; padding: 20px; margin: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }

        #homeScreen { text-align: center; padding-top: 8vh; }
        
        .titulo-animado {
            margin: 0 0 10px 0; 
            letter-spacing: -1.5px;
            font-size: 38px;
            font-weight: 900;
            display: inline-block;
            background: linear-gradient(120deg, #1c1c1e 30%, #007aff 50%, #1c1c1e 70%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shine 3s ease-in-out infinite;
        }

        @keyframes shine {
            0% { background-position: 100% center; }
            100% { background-position: -100% center; }
        }

        .number-display {
            display: flex; justify-content: center; gap: 15px; margin: 30px 0; min-height: 80px;
        }
        .digit-circle {
            width: 65px; height: 65px; border-radius: 50%;
            background: #fff; border: 2px solid #d1d1d6;
            display: flex; align-items: center; justify-content: center;
            font-size: 32px; font-weight: bold; color: var(--text);
            transition: all 0.2s ease;
        }
        .digit-circle.active { border-color: var(--accent); box-shadow: 0 0 15px rgba(0,122,255,0.2); color: var(--accent); }

        .keypad {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px;
            max-width: 320px; margin: 0 auto; padding: 10px;
        }
        .key {
            background: var(--card); border: none; height: 65px; border-radius: 15px;
            font-size: 18px; font-weight: 600; color: var(--text);
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); transition: transform 0.1s;
        }
        .key:active { background: var(--btn-gray); transform: scale(0.95); }
        .key.action { font-size: 14px; font-weight: 800; text-transform: uppercase; }

        #hinoScreen { display: none; padding-bottom: 140px; }
        .header-hino { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .btn-back { background: var(--btn-gray); border: none; color: var(--text); padding: 8px 15px; border-radius: 10px; font-weight: 600; cursor: pointer; }
        
        /* ESTILO DO BOTÃO DE TOM SELECIONADO */
        .tone-selector-container { position: relative; display: inline-block; }
        .current-tone-btn {
            background: var(--accent); color: white; border: none;
            padding: 8px 16px; border-radius: 10px; font-weight: 700;
            font-size: 14px; display: flex; align-items: center; gap: 8px;
        }

        /* CARD FLUTUANTE DE TONS */
        .tone-card {
            display: none; position: absolute; top: 45px; right: 0;
            background: var(--glass); backdrop-filter: blur(20px);
            width: 220px; padding: 15px; border-radius: 18px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.15); border: 1px solid rgba(255,255,255,0.3);
            z-index: 100; grid-template-columns: repeat(4, 1fr); gap: 8px;
        }
        .tone-card.show { display: grid; }
        .tone-mini-btn {
            background: var(--btn-gray); border: none; padding: 10px 0;
            border-radius: 8px; font-weight: 600; font-size: 12px; color: var(--text);
        }
        .tone-mini-btn.active { background: var(--accent); color: white; }

        .cifra-container { overflow-x: auto; background: #fafafa; border-radius: 10px; padding: 15px; margin-top: 10px; }
        .cifra-content { 
            white-space: pre-wrap; word-wrap: break-word;
            font-family: "SF Mono", "Menlo", monospace; 
            font-size: 15px; line-height: 2.2; color: #333;
        }
        .chord { color: var(--accent); font-weight: bold; }

        .scroll-controls {
            position: fixed; bottom: 25px; left: 15px; right: 15px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(20px);
            border-radius: 25px; padding: 15px 20px; border: 1px solid rgba(0,0,0,0.08);
            display: flex; align-items: center; gap: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }
        .scroll-btn { background: var(--accent); color: white; border: none; width: 60px; height: 60px; border-radius: 50%; font-weight: 800; }
        .speed-control { flex-grow: 1; display: flex; flex-direction: column; }
        .speed-label { font-size: 11px; text-transform: uppercase; color: var(--secondary); margin-bottom: 5px; }
        input[type=range] { width: 100%; accent-color: var(--accent); cursor: pointer; }
    </style>
</head>
<body>

<div class="app">
    <div id="homeScreen">
        <h1 class="titulo-animado">Hinário Cifrado</h1>
        
        <div class="number-display" id="dotsContainer">
            <div class="digit-circle" id="dot0"></div>
            <div class="digit-circle" id="dot1"></div>
            <div class="digit-circle" id="dot2"></div>
        </div>

        <div class="keypad">
            <button class="key" onclick="pressKey('1')">1</button>
            <button class="key" onclick="pressKey('2')">2</button>
            <button class="key" onclick="pressKey('3')">3</button>
            <button class="key" onclick="pressKey('4')">4</button>
            <button class="key" onclick="pressKey('5')">5</button>
            <button class="key" onclick="pressKey('6')">6</button>
            <button class="key" onclick="pressKey('7')">7</button>
            <button class="key" onclick="pressKey('8')">8</button>
            <button class="key" onclick="pressKey('9')">9</button>
            <button class="key action" style="color: var(--danger)" onclick="deleteLastKey()">APAGAR</button>
            <button class="key" onclick="pressKey('0')">0</button>
            <button class="key action" style="color: var(--accent)" onclick="abrirHinoManual()">ABRIR</button>
        </div>
    </div>

    <div id="hinoScreen">
        <div class="card">
            <div class="header-hino">
                <button class="btn-back" onclick="voltar()">‹ Sair</button>
                
                <div class="tone-selector-container">
                    <button class="current-tone-btn" onclick="toggleToneCard()">
                        TOM: <span id="currentToneLabel">-</span> ▾
                    </button>
                    <div id="toneCard" class="tone-card"></div>
                </div>
            </div>

            <div id="hinoNumero" style="font-weight: 800; font-size: 12px; color: var(--secondary); margin-bottom: 5px; letter-spacing: 1px;"></div>
            <h2 id="hinoTitulo" style="margin: 0 0 15px 0; font-size: 24px; font-weight: 800;"></h2>

            <div class="cifra-container">
                <div class="cifra-content" id="cifraRender"></div>
            </div>
        </div>

        <div class="scroll-controls">
            <button id="scrollToggle" class="scroll-btn" onclick="toggleScroll()">PLAY</button>
            <div class="speed-control">
                <span class="speed-label">Velocidade</span>
                <input type="range" id="scrollSpeed" min="0" max="3" step="0.001" value="0.2">
            </div>
        </div>
    </div>
</div>

<script>
    const BANCO_DE_DADOS = {
        "1": { titulo: "Grandioso és Tu", tomOriginal: "G", letra: `G               C               G\nSenhor meu Deus, quando eu maravilhado\n           D      D7           G   D7\nFico a pensar nas obras de Tuas mãos` },
        "15": { titulo: "Foi na Cruz", tomOriginal: "E", letra: `E               A               E\nOh! quão cego andei e perdido busquei` }
    };

    const notasDisplay = ["C", "D", "E", "F", "G", "A", "B", "Cm", "Dm", "Em", "Fm", "Gm", "Am", "Bm"];
    const notasEscala = ["C", "C#", "D", "D#", "E", "F", "F#", "G", "G#", "A", "A#", "B"];
    
    let hinoAtual = null;
    let offsetAtual = 0;
    let isScrolling = false;
    let currentInput = "";
    let scrollPos = 0;

    // GERAR OS BOTÕES DENTRO DO CARD DE TOM
    const toneCard = document.getElementById('toneCard');
    notasDisplay.forEach((nota) => {
        let btn = document.createElement('button');
        btn.className = 'tone-mini-btn';
        btn.innerText = nota;
        btn.onclick = (e) => {
            e.stopPropagation();
            mudarTom(nota);
            toggleToneCard(); // Fecha o card após selecionar
        };
        btn.id = `btn-tom-${nota}`;
        toneCard.appendChild(btn);
    });

    function toggleToneCard() {
        toneCard.classList.toggle('show');
    }

    // Fecha o card se clicar fora
    window.onclick = function(event) {
        if (!event.target.matches('.current-tone-btn')) {
            if (toneCard.classList.contains('show')) {
                toneCard.classList.remove('show');
            }
        }
    }

    function updateDots() {
        for(let i=0; i<3; i++) {
            const dot = document.getElementById(`dot${i}`);
            if (currentInput[i]) {
                dot.innerText = currentInput[i];
                dot.classList.add('active');
            } else {
                dot.innerText = "";
                dot.classList.remove('active');
            }
        }
    }

    function pressKey(key) {
        if (currentInput.length < 3) {
            currentInput += key;
            updateDots();
        }
    }

    function deleteLastKey() {
        currentInput = currentInput.slice(0, -1);
        updateDots();
    }

    function abrirHinoManual() {
        const num = parseInt(currentInput).toString(); 
        if (BANCO_DE_DADOS[num]) {
            abrirHino(num);
        } else {
            alert("Hino não encontrado!");
            currentInput = ""; 
            updateDots();
        }
    }

    function abrirHino(num) {
        hinoAtual = BANCO_DE_DADOS[num];
        offsetAtual = 0;
        document.getElementById('homeScreen').style.display = 'none';
        document.getElementById('hinoScreen').style.display = 'block';
        document.getElementById('hinoNumero').innerText = `HINO ${num}`;
        document.getElementById('hinoTitulo').innerText = hinoAtual.titulo;
        mudarTom(hinoAtual.tomOriginal);
        scrollPos = 0;
        window.scrollTo(0,0);
    }

    function voltar() {
        stopScroll();
        document.getElementById('homeScreen').style.display = 'block';
        document.getElementById('hinoScreen').style.display = 'none';
        currentInput = "";
        updateDots();
    }

    function mudarTom(notaEscolhida) {
        let notaBaseOriginal = hinoAtual.tomOriginal.replace(/m|dim|sus/g, '');
        let notaBaseEscolhida = notaEscolhida.replace(/m|dim|sus/g, '');
        offsetAtual = (notasEscala.indexOf(notaBaseEscolhida) - notasEscala.indexOf(notaBaseOriginal) + 12) % 12;
        
        document.getElementById('currentToneLabel').innerText = notaEscolhida;
        document.querySelectorAll('.tone-mini-btn').forEach(b => b.classList.remove('active'));
        const btn = document.getElementById(`btn-tom-${notaEscolhida}`);
        if(btn) btn.classList.add('active');
        renderizarCifra();
    }

    function transporNota(nota, semitons) {
        return nota.replace(/[CDEFGAB][#b]?/g, (match) => {
            let index = notasEscala.indexOf(match.replace('b', ''));
            if (index === -1) return match;
            return notasEscala[(index + semitons + 12) % 12];
        });
    }

    function renderizarCifra() {
        const linhas = hinoAtual.letra.split('\n');
        const resultado = linhas.map(linha => {
            const eLinhaDeCifra = /^\s*([CDEFGAB][#b]?[a-zA-Z0-9/+#]*\s*)+$/.test(linha);
            if (eLinhaDeCifra) {
                return linha.replace(/[CDEFGAB][#b]?[a-zA-Z0-9/+#]*/g, (nota) => {
                    return `<span class="chord">${transporNota(nota, offsetAtual)}</span>`;
                });
            }
            return linha;
        }).join('\n');
        document.getElementById('cifraRender').innerHTML = resultado;
    }

    function stepScroll() {
        if (!isScrolling) return;
        const speed = parseFloat(document.getElementById('scrollSpeed').value);
        if (speed > 0) {
            scrollPos += speed;
            if (scrollPos >= 1) {
                window.scrollBy(0, Math.floor(scrollPos));
                scrollPos -= Math.floor(scrollPos);
            }
        }
        requestAnimationFrame(stepScroll);
    }

    function toggleScroll() {
        if (isScrolling) {
            stopScroll();
        } else {
            isScrolling = true;
            document.getElementById('scrollToggle').innerText = "STOP";
            document.getElementById('scrollToggle').style.background = "var(--danger)";
            scrollPos = 0;
            stepScroll();
        }
    }

    function stopScroll() {
        isScrolling = false;
        document.getElementById('scrollToggle').innerText = "PLAY";
        document.getElementById('scrollToggle').style.background = "var(--accent)";
    }
</script>
</body>
</html>
